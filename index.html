<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>스텝가드 보행 모니터링 서비스 시연</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6ECE9; --surface:#FFFFFF; --surface-2:#F1F5F3; --ink:#16302A; --muted:#566B64; --line:#D3DDD8;
  --green:#1E7656; --green-soft:#D4EBE0; --amber:#A9650F; --amber-soft:#F8E6C8;
  --coral:#C23E26; --coral-soft:#F9DAD2; --sky:#2A6FB6; --sky-soft:#D8E6F5;
  --frame:#16302A; --side:#16302A; --road:#DCE4E0; --map:#F3F7F5; --sun:#E9A21F; --cloud:#AFC0BA;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1816; --surface:#152420; --surface-2:#1C2E29; --ink:#E2EDE9; --muted:#93A8A1; --line:#2A3E39;
  --green:#4CC198; --green-soft:#1A3A30; --amber:#E6AA54; --amber-soft:#3A2C15;
  --coral:#F07B62; --coral-soft:#43231C; --sky:#6DACEA; --sky-soft:#1A2F45;
  --frame:#050C0A; --side:#0A1513; --road:#2A3B37; --map:#182824; --sun:#F2B544; --cloud:#5E716B; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1816; --surface:#152420; --surface-2:#1C2E29; --ink:#E2EDE9; --muted:#93A8A1; --line:#2A3E39;
  --green:#4CC198; --green-soft:#1A3A30; --amber:#E6AA54; --amber-soft:#3A2C15;
  --coral:#F07B62; --coral-soft:#43231C; --sky:#6DACEA; --sky-soft:#1A2F45;
  --frame:#050C0A; --side:#0A1513; --road:#2A3B37; --map:#182824; --sun:#F2B544; --cloud:#5E716B; color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;font-size:15px;line-height:1.55;word-break:keep-all}
button,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:8px}

.top{max-width:1320px;margin:0 auto;padding:22px 20px 0;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.top h1{font-size:24px;letter-spacing:-0.02em;line-height:1.3}
.top p{color:var(--muted);font-size:14px}
.roles{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:2px}
.roles button{border:0;background:transparent;padding:9px 16px;border-radius:10px;font-weight:600;font-size:14.5px;color:var(--muted);position:relative}
.roles button[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.roles .dot{position:absolute;top:5px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--coral);display:none}
.roles .dot.on{display:block}

.wrap{max-width:1320px;margin:0 auto;padding:18px 20px 48px;display:grid;grid-template-columns:290px minmax(0,1fr);gap:24px;align-items:start}

/* presenter */
.panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px);display:grid;gap:14px}
.card-p{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.card-p h2{font-size:15px;margin-bottom:8px}
.scenes{display:grid;gap:6px}
.scene{text-align:left;background:var(--surface-2);border:1.5px solid transparent;border-radius:12px;padding:9px 11px;display:grid;grid-template-columns:10px 1fr;gap:10px;align-items:start}
.scene i{width:10px;height:10px;border-radius:50%;margin-top:6px}
.scene b{display:block;font-size:14px}
.scene span{font-size:12.5px;color:var(--muted)}
.scene[aria-pressed="true"]{border-color:var(--ink);background:var(--surface)}
.hint{font-size:13.5px;background:var(--sky-soft);border-radius:10px;padding:9px 11px}
.log{list-style:none;display:grid;gap:7px;max-height:260px;overflow:auto}
.log li{font-size:13px;display:grid;grid-template-columns:56px 1fr;gap:6px}
.log li span:first-child{color:var(--muted);font-variant-numeric:tabular-nums}
.log li b{font-weight:600}
.log .who{font-style:normal;display:inline-block;font-size:11.5px;font-weight:600;padding:0 6px;border-radius:6px;margin-right:4px;background:var(--surface-2)}
.log li.log-empty{display:block;font-size:13px;color:var(--muted)}
.log li span:last-child{line-height:1.45}
.reset{background:transparent;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:13.5px;justify-self:start}

/* device frames */
.stage{min-width:0}
.phone{width:392px;max-width:100%;height:800px;border:11px solid var(--frame);border-radius:42px;background:var(--surface-2);overflow:hidden;position:relative;margin:0 auto}
.scr{height:100%;overflow-y:auto;position:relative}
.web{background:var(--surface-2);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:grid;grid-template-columns:200px minmax(0,1fr);min-height:760px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,10px);background:var(--ink);color:var(--surface);padding:12px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:50;max-width:min(520px,90vw)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* elder app: large, calm */
.el{padding:22px 18px 26px;font-size:19px;line-height:1.5}
.el-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.el-head h2{font-size:24px;line-height:1.3}
.voice{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:16px;font-weight:600;display:flex;align-items:center;gap:6px}
.voice svg{width:20px;height:20px}
.weather{background:var(--surface);border-radius:26px;padding:18px 18px 20px;text-align:center;margin-bottom:14px;border:1px solid var(--line)}
.weather svg{width:150px;height:118px;display:block;margin:0 auto 4px}
.weather .say{font-size:25px;font-weight:700;line-height:1.35}
.weather .sub{font-size:18px;color:var(--muted);margin-top:4px}
.el-card{background:var(--surface);border-radius:22px;padding:16px 18px;margin-bottom:14px;border:1px solid var(--line)}
.el-card h3{font-size:17px;color:var(--muted);font-weight:600;margin-bottom:6px}
.el-card .big{font-size:21px;font-weight:700;line-height:1.4}
.journey{margin:12px 0 4px;position:relative;height:66px}
.journey svg{width:100%;height:66px;display:block}
.journey .lab{fill:var(--muted);font-size:14px;font-family:inherit}
.el-btn{width:100%;border:0;border-radius:20px;padding:18px;font-size:22px;font-weight:700;background:var(--green);color:#fff;margin-top:4px}
.el-btn.light{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.el-btn + .el-btn{margin-top:10px}
.el-q{display:grid;gap:12px;margin-top:18px}
.el-note{font-size:16px;color:var(--muted);text-align:center;margin-top:12px}
.figure svg{width:100%;height:150px;display:block}
.cue{border-radius:20px;padding:16px 18px;margin-bottom:14px;font-size:21px;font-weight:700;line-height:1.4;background:var(--sky-soft)}
.cue.good{background:var(--green-soft)}
.cue small{display:block;font-size:16px;font-weight:500;color:var(--muted);margin-top:4px}
.feetbuzz{display:flex;justify-content:center;gap:40px;margin:6px 0 2px}
.feetbuzz div{text-align:center;font-size:15px;color:var(--muted)}
.feetbuzz svg{width:46px;height:84px;display:block;margin:0 auto 2px}
.feetbuzz .sole{fill:var(--surface-2);stroke:var(--line);stroke-width:2}
.feetbuzz .on .sole{fill:var(--sky-soft);stroke:var(--sky);stroke-width:3}
.feetbuzz .on svg{animation:buzz .18s linear infinite}
@keyframes buzz{0%{transform:translateX(-1.5px)}50%{transform:translateX(1.5px)}100%{transform:translateX(-1.5px)}}
.emer{position:absolute;inset:0;background:var(--coral);color:#fff;padding:34px 22px;display:flex;flex-direction:column;justify-content:center;z-index:5}
.emer h2{font-size:38px;line-height:1.2;margin-bottom:10px}
.emer p{font-size:20px;line-height:1.5}
.emer .count{font-size:22px;margin:16px 0 18px;font-weight:600}
.emer .el-btn{background:#fff;color:#8E2614}
.emer .el-btn.light{background:transparent;color:#fff;border:3px solid rgba(255,255,255,.8)}
.emer .demo{margin-top:14px;background:rgba(255,255,255,.15);border:0;border-radius:12px;padding:10px;color:#fff;font-size:15px}
.plant svg{width:150px;height:150px;display:block;margin:0 auto}

/* guardian app */
.gd{padding:16px 15px 90px;font-size:15px}
.gd-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.gd-top b{font-size:18px}
.gd-top span{font-size:12.5px;color:var(--muted)}
.who{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.who svg{width:44px;height:44px;flex:none}
.who .n{font-weight:700;font-size:16.5px}
.who .s{font-size:13px;color:var(--muted)}
.pill{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.warn{background:var(--amber-soft);color:var(--amber)}
.pill.bad{background:var(--coral-soft);color:var(--coral)}
.pill.info{background:var(--sky-soft);color:var(--sky)}
.pill.mute{background:var(--surface-2);color:var(--muted)}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.blk h3{font-size:14.5px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:2px 8px;flex-wrap:wrap}
.blk h3 small{font-weight:400;color:var(--muted);font-size:12.5px}
.todo{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.todo:first-of-type{border-top:0;padding-top:2px}
.todo b{display:block;font-size:14.5px}
.todo span{font-size:13px;color:var(--muted)}
.sbtn{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:600;white-space:nowrap}
.sbtn.pri{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.sbtn.done{background:var(--green-soft);color:var(--green);border-color:transparent}
.alerts{list-style:none}
.alerts li{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.alerts li:first-child{border-top:0;padding-top:0}
.alerts time{color:var(--muted);font-variant-numeric:tabular-nums}
.mets{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.met{background:var(--surface-2);border-radius:12px;padding:10px 11px}
.met .k{font-size:12.5px;color:var(--muted)}
.met .v{font-size:19px;font-weight:700}
.met .v small{font-size:12px;color:var(--muted);font-weight:500;margin-left:2px}
.met .d{font-size:12.5px;font-weight:600}
.d.up{color:var(--green)} .d.down{color:var(--amber)} .d.flat{color:var(--muted)}
.plain{font-size:14px;background:var(--surface-2);border-radius:12px;padding:10px 12px;margin-top:10px}
.plain b{display:block}
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:inherit;font-size:10.5px;fill:var(--muted)}
.chart .ln{fill:none;stroke:var(--green);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart.warn .ln{stroke:var(--amber)}
.chart .pt{fill:var(--green)} .chart.warn .pt{fill:var(--amber)}
.chart .ref{stroke:var(--coral);stroke-dasharray:4 4;stroke-width:1.2}
.chart .ref2{stroke:var(--muted);stroke-dasharray:4 4;stroke-width:1}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--green-soft)} .chart .bar.hi{fill:var(--amber)}
.bal{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface-2);margin:6px 0 4px}
.bal i{display:block;height:100%}
.bal .l{background:var(--green)} .bal .r{background:var(--sky)}
.bal-lab{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.check:first-of-type{border-top:0}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--green);flex:none}
.map svg{width:100%;height:auto;display:block;border-radius:12px;background:var(--map)}
.map .road{stroke:var(--road);stroke-width:12;stroke-linecap:round}
.map .usual{fill:none;stroke:var(--green);stroke-width:2.5;stroke-dasharray:2 6;stroke-linecap:round}
.map .place{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.map text{font-family:inherit;font-size:11px;fill:var(--muted);font-weight:500}
.map .trail{fill:none;stroke:var(--sky);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;opacity:.7}
.map .me{fill:var(--sky);stroke:var(--surface);stroke-width:3}
.map .me.bad{fill:var(--coral)}
.tabbar{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:3}
.tabbar button{border:0;background:transparent;font-size:12px;font-weight:600;color:var(--muted);padding:6px 2px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-selected="true"]{color:var(--ink);background:var(--surface-2)}
.tabbar .dot{position:absolute;top:3px;right:18%;width:8px;height:8px;border-radius:50%;background:var(--coral);display:none}
.tabbar .dot.on{display:block}
.gem{position:absolute;inset:0;background:var(--surface-2);z-index:4;overflow-y:auto;padding:16px 15px 24px}
.gem .head{background:var(--coral);color:#fff;border-radius:16px;padding:14px;margin-bottom:12px}
.gem .head b{display:block;font-size:19px;line-height:1.35}
.gem .head.wander{background:var(--amber)}
.gem .head.ok{background:var(--green)}
.steps{list-style:none;display:grid;gap:0}
.steps li{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:8px 0;font-size:14px;position:relative}
.steps li::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--line);background:var(--surface);margin-top:4px;margin-left:4px}
.steps li.on::before{background:var(--coral);border-color:var(--coral)}
.steps li.done::before{background:var(--green);border-color:var(--green)}
.steps li span{color:var(--muted);font-size:12.5px;display:block}
.infocard .row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.infocard .row:first-of-type{border-top:0}
.infocard .row span:last-child{font-weight:600;text-align:right}
.gbtn{width:100%;border:0;border-radius:14px;padding:13px;font-weight:700;font-size:15px;margin-top:8px}
.gbtn.red{background:var(--coral);color:#fff}
.gbtn.dark{background:var(--ink);color:var(--surface)}
.gbtn.line{background:var(--surface);border:1px solid var(--line)}
.dev{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.dev:first-of-type{border-top:0}
.dev b{display:block;font-size:14.5px}
.dev span{font-size:12.5px;color:var(--muted)}
.batt{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px}
.batt .c{width:32px;height:14px;border:2px solid var(--muted);border-radius:4px;padding:1px}
.batt .c i{display:block;height:100%;background:var(--green);border-radius:1px}
.batt.low{color:var(--coral)} .batt.low .c i{background:var(--coral)}

/* org web */
.side{background:var(--side);color:#E2EDE9;padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.side .org{font-size:13px;opacity:.8;margin:0 8px 2px}
.side .orgn{font-size:16px;font-weight:700;margin:0 8px 14px;line-height:1.35}
.side button{border:0;background:transparent;color:#C9D8D3;text-align:left;padding:10px 12px;border-radius:10px;font-weight:600;font-size:14.5px;display:flex;justify-content:space-between;align-items:center}
.side button[aria-selected="true"]{background:rgba(255,255,255,.12);color:#fff}
.side .cnt{background:var(--coral);color:#fff;border-radius:999px;font-size:11.5px;padding:0 7px}
.orgsw{margin-top:auto;display:grid;gap:4px;font-size:12.5px;opacity:.95}
.orgsw div{display:flex;background:rgba(255,255,255,.08);border-radius:10px;padding:3px}
.orgsw button{flex:1;padding:6px 4px;font-size:12.5px;text-align:center;justify-content:center}
.main{padding:20px 22px 28px;min-width:0}
.main h2{font-size:20px;margin-bottom:2px}
.main .lead{color:var(--muted);font-size:13.5px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;border-left-width:5px}
.kpi b{display:block;font-size:26px;line-height:1.1}
.kpi span{font-size:13px;color:var(--muted)}
.kpi.bad{border-left-color:var(--coral)} .kpi.warn{border-left-color:var(--amber)} .kpi.info{border-left-color:var(--sky)} .kpi.mute{border-left-color:var(--muted)}
.tblw{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13.5px;min-width:720px}
.t th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr{cursor:pointer}
.t tbody tr:hover td{background:var(--surface-2)}
.t td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.dhead .sel{display:flex;gap:6px;flex-wrap:wrap}
.soap{display:grid;gap:12px}
.soap .sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:44px 1fr;gap:12px}
.soap .letter{width:40px;height:40px;border-radius:10px;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700;font-size:20px}
.soap .sec h4{font-size:14.5px;margin-bottom:4px;display:flex;gap:8px;align-items:center}
.soap ul{padding-left:18px;font-size:13.5px}
.soap li{margin-bottom:3px}
.soap textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--surface-2);resize:vertical;font-size:13.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--green);color:#fff;border-color:var(--green)}
.otable{width:100%;border-collapse:collapse;font-size:13px}
.otable th,.otable td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.otable th{color:var(--muted);font-weight:600}
.modal{position:fixed;inset:0;background:rgba(10,20,18,.5);display:none;align-items:center;justify-content:center;z-index:40;padding:20px}
.modal.show{display:flex}
.modal .box{background:var(--surface);border-radius:18px;max-width:460px;width:100%;padding:20px;max-height:85vh;overflow:auto}
.modal h3{font-size:17px;margin-bottom:8px}
.modal p{font-size:14.5px;margin-bottom:8px}
.ev{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;border-left:5px solid var(--line)}

 var scrTop=$('scr')?$('scr').scrollTop:0;
 $('stage').innerHTML=S.role==='elder'?renderElder():S.role==='guard'?renderGuard():renderOrg();
 if($('scr')&&S._keepScroll)$('scr').scrollTop=scrTop;S._keepScroll=false;
 document.querySelectorAll('.roles button').forEach(function(b){b.setAttribute('aria-selected',b.dataset.role===S.role);});
 ['guard','org'].forEach(function(r){$('dot-'+r).classList.toggle('on',S.dots[r]&&S.role!==r);});
}
function renderPanel(){
 $('scenes').innerHTML=SCENES.map(function(s){return '<button class="scene" data-scene="'+s.id+'" aria-pressed="'+(S.scene===s.id)+'"><i style="background:'+s.c+'"></i><div><b>'+s.name+'</b><span>'+s.desc+'</span></div></button>';}).join('');
 $('hint').textContent=SCENES.filter(function(s){return s.id===S.scene;})[0].hint;
 renderLog();
}
function renderLog(){
 var W={elder:'어르신',guard:'보호자',org:'기관',sys:'신발'};
 $('log').innerHTML=S.log.length?S.log.map(function(l){return '<li><span>'+l.t+'</span><span><i class="who">'+W[l.who]+'</i>'+l.text+'</span></li>';}).join(''):'<li class="log-empty">시나리오를 누르면 누가 어떤 알림을 받는지 여기에 표시돼요.</li>';
}
function soft(){S._keepScroll=true;render();}

/* ---------- scenarios ---------- */
function clearTimers(){clearInterval(fallTimer);clearInterval(walkTimer);clearInterval(moveTimer);timers.forEach(clearTimeout);timers=[];}
function later(fn,ms){timers.push(setTimeout(fn,reduce?Math.min(ms,1200):ms));}
function startScene(id){
 clearTimers();var keepOrg=S?S.orgType:'bogun';S=fresh();S.orgType=keepOrg;S.scene=id;
 var sc=SCENES.filter(function(s){return s.id===id;})[0];S.role=sc.role;
 if(id==='change'){Object.assign(S.d,CHANGE);addLog('sys','3주간 보행 속도 13% 감소, 좌우 균형 39 : 61');addLog('guard','주간 알림과 이번 주 할 일 3가지');addLog('org','주의 대상으로 분류');addLog('elder','“구름 조금”과 천천히 걷기 안내');dot('guard',true);dot('org',true);}
 if(id==='walk'){S.el='walk';startWalk();}
 if(id==='wander'){S.gt='loc';startWander();}
 if(id==='fall'){startFall();}
 if(id==='device'){addLog('sys','제어 모듈 배터리 12%');addLog('guard','충전 알림');addLog('org','기기 확인 목록에 추가');addLog('elder','“신발 충전이 필요해요” 안내');dot('guard',true);dot('org',true);}
 renderPanel();render();
}
function startWalk(){
 S.walkCue=0;S.walkSteps=0;
 walkTimer=setInterval(function(){S.walkSteps+=2;var n=document.querySelector('.el-note');if(n&&S.role==='elder'&&S.el==='walk')n.textContent='오늘 '+(M().steps+S.walkSteps).toLocaleString('ko-KR')+'걸음 걸으셨어요';},1100);
 if(S.scene!=='walk')return;
 later(function(){S.walkCue=1;addLog('sys','왼발 부하 40%로 쏠림 감지');addLog('elder','왼발 진동과 “왼발을 꾹 딛어 보세요” 안내');if(S.role==='elder'&&S.el==='walk')soft();},2200);
 later(function(){S.walkCue=2;addLog('sys','좌우 균형 49 : 51로 회복');addLog('elder','“양발이 고르게 닿아요” 칭찬');if(S.role==='elder'&&S.el==='walk')soft();},7500);
}
function startWander(){
 var pts=[[182,98],[200,84],[222,70],[240,58],[258,48],[272,40],[286,48],[284,62],[270,66],[258,58],[264,44],[278,38],[288,50],[280,64],[266,62]];
 var i=0,seg=0;S.route={pos:{x:182,y:98},trail:['182,98'],dist:'약 160m'};S.wander={alerted:false,seen:false};
 addLog('sys','경로당에서 나와 이동 시작');
 moveTimer=setInterval(function(){
  seg+=0.5;if(seg>=1){seg=0;i++;}if(i>=pts.length-1){i=6;}
  var a=pts[i],b=pts[i+1],x=a[0]+(b[0]-a[0])*seg,y=a[1]+(b[1]-a[1])*seg;S.route.pos={x:x,y:y};S.route.trail.push(x.toFixed(0)+','+y.toFixed(0));if(S.route.trail.length>40)S.route.trail.shift();
  var dm=Math.round(Math.hypot(x-100,y-160)*3/10)*10;S.route.dist='약 '+dm+'m';
  if(!S.wander.alerted&&i>=7){S.wander.alerted=true;S.wander.t=hhmm();addLog('sys','같은 구역 반복 이동, 평소 길에서 300m 이상 이탈');addLog('guard','배회 의심 알림과 위치');addLog('org','응급 관제에 배회 의심 등록');addLog('elder','“집으로 가는 길 보기” 안내');dot('guard',true);dot('org',true);render();return;}
  var me=document.querySelector('.map .me'),tr=document.querySelector('.map .trail');
  if(me){me.setAttribute('cx',x.toFixed(1));me.setAttribute('cy',y.toFixed(1));}if(tr)tr.setAttribute('points',S.route.trail.join(' '));var gd=$('g-dist');if(gd)gd.textContent=S.route.dist;
 },reduce?1000:450);
}
function startFall(){
 S.fall={stage:1,left:10,t:hhmm(),resolved:null};S.route={pos:{x:112,y:186},trail:['100,160','108,176','112,186'],dist:'약 30m'};addLog('sys','강한 충격 후 움직임 없음');addLog('elder','“괜찮으세요?” 확인 화면');
 fallTimer=setInterval(function(){
  var f=S.fall;if(!f||f.resolved){clearInterval(fallTimer);return;}
  f.left--;
  if(f.left<=0){
   if(f.stage===1){f.stage=2;f.left=10;addLog('guard','10초 무응답: 낙상 의심 알림, 응급 정보 카드');dot('guard',true);}
   else if(f.stage===2){f.stage=3;f.left=0;addLog('org','20초 무응답: '+(S.orgType==='yoyang'?'늘봄 요양원':'한빛구 보건소')+' 응급 관제 등록');addLog('sys','119에 위치와 응급 정보 메시지 전송');dot('org',true);clearInterval(fallTimer);}
   soft();return;
  }
  var c=document.querySelector('.emer .count');if(c&&S.role==='elder'){c.innerHTML=f.stage===1?f.left+'초 안에 답이 없으면<br>가족에게 알려요':'가족에게 알렸어요<br>'+f.left+'초 뒤 담당 기관과 119에 알려요';}
  if(S.role==='guard'&&f.stage===2)soft();
 },1000);
}

/* ---------- events ---------- */
document.querySelector('.roles').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;S.role=b.dataset.role;S.dots[S.role]=false;render();});
$('scenes').addEventListener('click',function(e){var b=e.target.closest('.scene');if(b)startScene(b.dataset.scene);});
$('reset').addEventListener('click',function(){startScene('normal');});
$('modal').addEventListener('click',function(e){if(e.target.id==='modal'||e.target.closest('[data-a="closemodal"]'))$('modal').classList.remove('show');});
document.addEventListener('keydown',function(e){if(e.key==='Escape')$('modal').classList.remove('show');});
$('stage').addEventListener('input',function(e){if(e.target.dataset.a==='soapA')S.soap.A=e.target.value;});
$('stage').addEventListener('change',function(e){var t=e.target;if(t.dataset.a==='check'){S.checks[t.dataset.id]=t.checked;soft();}});
$('stage').addEventListener('click',function(e){
 var b=e.target.closest('[data-a]');if(!b||b.dataset.a==='check'||b.dataset.a==='soapA')return;var a=b.dataset.a;
 if(a==='voice'){var t=S.el==='walk'?(S.walkCue===1?'왼발을 조금 더 꾹 딛어 보세요':'지금처럼 걸어 보세요'):S.el==='result'?'잘하셨어요. 내일도 함께 걸어요':M().say+'. '+M().sub;speak(t);return;}
 if(a==='walk'){S.el='walk';if(S.scene!=='walk'){S.walkCue=0;clearInterval(walkTimer);startWalk();}addLog('elder','걷기 시작');render();return;}
 if(a==='endwalk'){S.el='result';clearInterval(walkTimer);addLog('elder','걷기 결과: 잘한 점과 다음 연습');addLog('guard','오늘 걸음 기록 갱신');render();return;}
 if(a==='home'){S.el='home';render();return;}
 if(a==='question'){S.el='question';render();return;}
 if(a==='conf'){S.conf=+b.dataset.v;S.el='home';addLog('elder','이번 주 질문 응답: '+['괜찮아요','조금 걱정돼요','걱정돼요'][S.conf]);addLog('org','방문 기록 S 항목에 자동 반영');toast('답해 주셔서 고마워요');render();return;}
 if(a==='fine'||a==='help'){
  if(!S.fall)return;clearInterval(fallTimer);
  if(a==='fine'){S.fall.resolved='ok';if(S.fall.stage<2)S.fall.stage=2;addLog('elder','“괜찮아요” 응답');addLog('guard','괜찮다고 응답하셨다는 알림');addLog('org','낙상 감지 해제 기록');dot('guard',true);toast('괜찮다고 가족에게 전했어요');}
  else{S.fall.stage=3;addLog('elder','“도와주세요” 응답');addLog('guard','즉시 낙상 알림');addLog('org','응급 관제 등록, 119 메시지 전송');dot('guard',true);dot('org',true);}
  S.el='home';render();return;}
 if(a==='homeway'){toast('집까지 약 450m, 큰길을 따라 왼쪽으로 가세요 (음성 안내)');return;}
 if(a==='callkid'||a==='callmom'){toast('시연 화면이라 실제로 전화를 걸지 않아요');return;}
 if(a==='c119'){toast('시연 화면이라 실제로 신고하지 않아요');return;}
 if(a==='guide'){addLog('guard','어머니 화면에 집 가는 길 띄움');addLog('elder','집으로 가는 길 안내 표시');toast('어머니 화면에 집으로 가는 길을 띄웠어요');return;}
 if(a==='seenwander'){S.wander.seen=true;S.gt='loc';render();return;}
 if(a==='closegem'){if(S.fall)S.fall.hide=true;render();return;}
 if(a==='gt'){S.gt=b.dataset.id;if(S.gt==='loc'&&S.wander)S.wander.seen=true;render();return;}
 if(a==='todo'){var id=b.dataset.id,l=b.dataset.l;if(l==='체크리스트'){S.gt='life';render();return;}S.todoDone[id]=true;toast(l==='전화하기'?'시연 화면이라 실제로 전화를 걸지 않아요':l==='상담 요청'?'담당 기관에 상담 요청을 보냈어요':l==='응원 보내기'?'응원을 보냈어요. 어머니 신발이 짧게 진동하고 음성으로 전해져요':'주말 산책 계획을 어머니 화면에 보냈어요');if(l==='상담 요청'){addLog('guard','상담 요청');addLog('org','보호자 상담 요청 접수');dot('org',true);}soft();return;}
 if(a==='memo'){S.memoShared=true;addLog('guard','메모 공유: 왼쪽 무릎 통증');addLog('org','방문 기록 S 항목에 반영');soft();return;}
 if(a==='remind'){addLog('guard','충전 안내 보냄');addLog('elder','“신발 충전이 필요해요” 안내');toast('어머니 화면에 충전 안내를 보냈어요');return;}
 if(a==='ot'){S.ot=b.dataset.id;render();return;}
 if(a==='orgtype'){S.orgType=b.dataset.id;render();return;}
 if(a==='person'){S.person=b.dataset.id;S.ot='detail';render();return;}
 if(a==='pchip'){var v=b.dataset.v,i=S.soap.P.indexOf(v);if(i>=0)S.soap.P.splice(i,1);else S.soap.P.push(v);soft();return;}
 if(a==='sendp'){if(!S.soap.P.length){toast('보낼 연습을 먼저 골라 주세요');return;}S.practice=S.soap.P[0];addLog('org','계획 전송: '+S.soap.P.join(', '));addLog('elder','오늘의 연습이 “'+S.practice+'”으로 바뀜');toast('어르신 화면의 오늘의 연습을 바꿨어요');return;}
 if(a==='summary'){var p=personData('me'),c=S.scene==='change';$('modal-box').innerHTML='<h3>보호자용 요약</h3><p>지난 방문 이후 어머니의 걸음은 '+(c?'조금 느려졌어요. 왼발에 힘이 덜 실리고, 새벽에 휘청이는 일이 늘었어요.':'꾸준히 좋아지고 있어요. 걷는 속도와 균형 모두 안정적이에요.')+'</p><p>'+(S.soap.P.length?'다음 방문까지 “'+S.soap.P.join('”, “')+'” 연습을 함께 챙겨 주세요.':'다음 방문까지 지금처럼 매일 걷도록 응원해 주세요.')+'</p>'+(c?'<p>침실에서 화장실 가는 길에 야간등을 놓아 주시면 좋아요.</p>':'')+'<button class="gbtn dark" data-a="closemodal">닫기</button>';$('modal').classList.add('show');addLog('org','보호자용 요약 생성');return;}
 if(a==='savesoap'){addLog('org','방문 기록 저장');toast('방문 기록을 저장했어요');return;}
 if(a==='evbtn'){if(b.dataset.l==='위치 보기'){window.scrollTo({top:document.querySelector('.blk.map').getBoundingClientRect().top+window.scrollY-20,behavior:reduce?'auto':'smooth'});return;}toast('119 출동 요청이 접수된 것으로 표시했어요 (시연)');return;}
});

/* guardian emergency overlay hide support */
var _gEmer=gEmer;gEmer=function(){if(S.fall&&S.fall.hide)return '';return _gEmer();};

/* ---------- guided tour for judges ---------- */
var TOUR=[
 {scene:'normal',role:'elder',el:'home',t:'어르신 화면이에요. 숫자 대신 날씨 그림과 “시장 혼자 다녀오기” 같은 목표 활동으로 오늘 걸음을 보여줘요. “듣기”를 눌러 음성 안내도 들어 보세요.'},
 {scene:'walk',role:'elder',t:'걷는 중 화면이에요. 왼발에 힘이 덜 실리면 왼발 신발이 진동하고, 몇 초 뒤 걸음이 고르게 바뀌면 칭찬해 줘요.'},
 {scene:'change',role:'guard',gt:'home',t:'걸음이 느려지고 한쪽으로 쏠리면 보호자에게 “이번 주 할 일”을 알려줘요. 버튼을 눌러 할 일을 해 보세요.'},
 {scene:'change',role:'guard',gt:'trend',t:'보호자는 12주 동안의 걸음 변화를 참고선과 함께 쉬운 말로 확인해요.'},
 {scene:'change',role:'org',ot:'overview',t:'보건소·요양원은 여러 어르신을 위험도 순으로 한 화면에서 봐요. 김순자 님이 “주의”로 올라와 있어요. 왼쪽 아래에서 요양원으로도 바꿔 보세요.'},
 {scene:'change',role:'org',ot:'soap',t:'방문 기록(SOAP)의 S와 O는 자동으로 채워져요. 계획에서 연습을 골라 “어르신 화면으로 연습 보내기”를 눌러 보세요.'},
 {scene:'wander',role:'guard',gt:'loc',t:'평소 길을 벗어나 같은 곳을 맴돌면 몇 초 뒤 보호자에게 배회 알림이 와요. 이동 경로를 지켜보세요.'},
 {scene:'fall',role:'elder',t:'넘어짐이 감지되면 어르신께 먼저 물어요. 답하지 않으면 10초 뒤 보호자, 다시 10초 뒤 기관과 119로 알림이 가요. 위쪽 탭의 빨간 점을 따라가 보세요. 마지막 단계입니다.'}
];
var tourI=-1;
function tourGo(i){
 tourI=i;var T=TOUR[i],prev=TOUR[i-1];
 if(!(prev&&prev.scene===T.scene&&S.scene===T.scene))startScene(T.scene);
 S.role=T.role;S.dots[S.role]=false;if(T.gt)S.gt=T.gt;if(T.ot)S.ot=T.ot;if(T.el)S.el=T.el;
 render();
 $('tour').hidden=false;document.body.classList.add('touring');
 $('tour-text').innerHTML='<b>체험 안내 '+(i+1)+' / '+TOUR.length+'</b>'+T.t;
 $('tour-prev').disabled=i===0;$('tour-prev').style.opacity=i===0?.4:1;
 $('tour-next').textContent=i===TOUR.length-1?'마치기':'다음';
 if(window.innerWidth<=1100)$('stage').scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});
}
function tourEnd(){tourI=-1;$('tour').hidden=true;document.body.classList.remove('touring');toast('왼쪽(휴대폰에서는 아래쪽) 시연 시나리오로 자유롭게 눌러 보세요');}
$('tour-next').addEventListener('click',function(){if(tourI>=TOUR.length-1)tourEnd();else tourGo(tourI+1);});
$('tour-prev').addEventListener('click',function(){if(tourI>0)tourGo(tourI-1);});
$('tour-close').addEventListener('click',tourEnd);
$('tourstart').addEventListener('click',function(){tourGo(0);});

S=fresh();renderPanel();render();
tourGo(0);
})();
</script>
</body>
